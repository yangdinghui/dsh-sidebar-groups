# 提交到 awesome-dsh-plugin（社区插件列表 / dsh-market 的 Discover 数据源）
#
# 用法：把下面整段内容复制成 awesome-dsh-plugin 仓库里的一个**新文件**，
# 路径必须是 data/plugins/yangdinghui__dsh-sidebar-groups.yml
# 然后开 PR（一个 PR 最多 3 条，通常就 1 条）。
#
# 收录要求（CI 会查）：
#   - 仓库 package.json 声明 dsh.bundle —— 已有
#   - 仓库创建满 1 天
#   - 仓库加了 topic: dsh-plugin
#   - 描述与代码相符（CI 之后由维护者读源码核对）
#   - README 由脚本生成，不要手工改 awesome-dsh-plugin 的 README

url: https://github.com/yangdinghui/dsh-sidebar-groups
name: yangdinghui/dsh-sidebar-groups
category: ui
description:
  en: "Groups the sidebar's panel rows: two stay pinned, the rest fold under a collapsible Tools row, and rows can be dragged between the two groups."
  zh: "侧边栏面板分组：两行常驻，其余收进可折叠的「工具」组，支持拖动互相搬运。"
